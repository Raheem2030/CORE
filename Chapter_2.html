            <div class="space-y-6">
              <div class="rich-card p-6 border-r-4 border-r-violet-500">
                <h3 class="font-cairo font-bold text-lg mb-3 flex items-center gap-2 text-violet-500 dark:text-violet-400">
                  <i class="fa-solid fa-compass text-violet-500"></i>
                  تحديد الغاية: نقطة الانطلاق في هندسة البحث
                </h3>
                <p class="text-slate-300 leading-relaxed text-sm">
                  تختلف طريقة وهندسة البحث بشكل جذري بناءً على الهدف المعرفي الذي يسعى الممارس الصحي لتحقيقه. تنقسم الغايات التي تدفع الطبيب لدخول الأدبيات الطبية إلى ثلاثة مسارات كبرى:
                </p>
              </div>

              <!-- 3 Goals Cards -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="rich-card p-5 border-r-4 border-r-cyan-500">
                  <div class="flex items-center gap-2 text-cyan-500 font-cairo font-bold text-base mb-2">
                    <i class="fa-solid fa-newspaper"></i>
                    <span>1. التصفح العابر (Browsing)</span>
                  </div>
                  <ul class="text-xs text-slate-300 space-y-2 leading-relaxed">
                    <li><strong class="text-cyan-400">• عنصر المصادفة السعيدة (Serendipity):</strong> ملاحقة الفضول العلمي الذاتي ومواكبة المستجدات دون وجود سؤال مريض محدد.</li>
                    <li><strong class="text-cyan-400">• الأدوات الرقمية:</strong> تفعيل خدمات التنبيه (Alerting services)، وخلاصات المواقع الغنية (RSS Feeds) التي ترسل الملخصات للبريد أو البودكاست.</li>
                    <li><strong class="text-cyan-400">• التواصل الاجتماعي:</strong> استخدام منصة إكس (X) ونوادي المجلات الرقمية (مثل JOSPT Insights).</li>
                  </ul>
                </div>

                <div class="rich-card p-5 border-r-4 border-r-emerald-500">
                  <div class="flex items-center gap-2 text-emerald-500 font-cairo font-bold text-base mb-2">
                    <i class="fa-solid fa-bed-pulse"></i>
                    <span>2. إجابة سريرية (Looking)</span>
                  </div>
                  <ul class="text-xs text-slate-300 space-y-2 leading-relaxed">
                    <li><strong class="text-emerald-400">• التركيز السريري المباشر:</strong> بحث موجه ومحدد لحل مشكلة تشخيصية أو علاجية لمريض حقيقي في العيادة.</li>
                    <li><strong class="text-emerald-400">• قاعدة الوقوف الذاتي (Stopping Rule):</strong> بمجرد الوصول لدليل موثوق وكافٍ، <span class="underline decoration-emerald-400">توقف فوراً</span>؛ فلا داعي لقراءة كل ورقة في العالم.</li>
                    <li><strong class="text-emerald-400">• الخيار المثالي:</strong> استخدام المصادر التوليفية الفورية (Point-of-Care) كـ UpToDate وDynaMed.</li>
                  </ul>
                </div>

                <div class="rich-card p-5 border-r-4 border-r-amber-500">
                  <div class="flex items-center gap-2 text-amber-500 font-cairo font-bold text-base mb-2">
                    <i class="fa-solid fa-microscope"></i>
                    <span>3. مسح شامل (Surveying)</span>
                  </div>
                  <ul class="text-xs text-slate-300 space-y-2 leading-relaxed">
                    <li><strong class="text-amber-400">• الهدف الأكاديمي والبحثي:</strong> إعداد مراجعات منهجية، كتابة أطروحة ماجستير/دكتوراه، وتحديد الفجوات المعرفية (Knowledge gaps).</li>
                    <li><strong class="text-amber-400">• الصرامة المنهجية:</strong> البحث المتزامن في قواعد بيانات متعددة وتتبع الاستشهادات (Citation chaining).</li>
                    <li><strong class="text-amber-400">• الاستعانة الإلزامية:</strong> استشارة أخصائي معلومات طبي أو أمين مكتبة صحية لضمان الشمولية وعدم التحيز.</li>
                  </ul>
                </div>
              </div>
            </div>
          `
        },

        {
          id: "topic-5",
          title: "3.0 مستويات الأدلة وهرم الـ 6S ونموذج حلقة المناهج",
          level: 1,
          subtitle: "Levels of Evidence: Traditional vs 6S Pyramid & Circle of Methods",
          content: `
            <div class="space-y-6">
              <div class="rich-card p-6 border-r-4 border-r-violet-500">
                <h3 class="font-cairo font-bold text-lg mb-3 flex items-center gap-2 text-violet-500 dark:text-violet-400">
                  <i class="fa-solid fa-layer-group text-violet-500"></i>
                  مفهوم مستوى الدليل (Level of Evidence)
                </h3>
                <p class="text-slate-300 leading-relaxed text-sm">
                  يشير هذا المفهوم المنهجي إلى <strong>درجة الثقة والأمان التي يمكن منحها لنتائج ورقة علمية محددة</strong>، وتُحدد هذه الدرجة بالدرجة الأولى بناءً على جودة وقوة تصميم الدراسة ومنهجيتها (Study design). ليست كل الأدلة متكافئة في صدقها السريري (Believability).
                </p>
              </div>

              <!-- Pyramids Structural Comparison -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Traditional Pyramid -->
                <div class="rich-card p-5 border-r-4 border-r-cyan-500">
                  <h4 class="font-cairo font-bold text-base mb-3 text-cyan-500 flex items-center gap-2">
                    <i class="fa-solid fa-mountain"></i>
                    1. الهرم التقليدي الكلاسيكي (Traditional Hierarchy)
                  </h4>
                  <div class="space-y-2 text-xs">
                    <div class="p-2.5 bg-slate-800/60 rounded-lg border border-violet-500/40 text-violet-300 font-bold">
                      1. المراجعات المنهجية (Systematic Reviews) والتحليلات التلوية [القمة]
                    </div>
                    <div class="p-2.5 bg-slate-800/40 rounded-lg border border-cyan-500/30 text-cyan-300 font-semibold">
                      2. التجارب العشوائية ذات الشواهد (Randomised Controlled Trials - RCTs)
                    </div>
                    <div class="p-2.5 bg-slate-800/40 rounded-lg border border-slate-700 text-slate-300">
                      3. الدراسات القائمة على الملاحظة (Cohort & Case-Control Studies)
                    </div>
                    <div class="p-2.5 bg-slate-800/40 rounded-lg border border-slate-700 text-slate-400">
                      4. تقارير الحالات والآراء المخبرية وآراء الخبراء (Case Reports & Expert Opinion) [القاعدة]
                    </div>
                  </div>
                </div>

                <!-- 6S Contemporary Pyramid -->
                <div class="rich-card p-5 border-r-4 border-r-emerald-500">
                  <h4 class="font-cairo font-bold text-base mb-3 text-emerald-500 flex items-center gap-2">
                    <i class="fa-solid fa-cubes-stacked"></i>
                    2. هرم الـ 6S المعاصر لأخصائيي المكتبات (DiCenso 6S Model)
                  </h4>
                  <div class="space-y-1.5 text-xs">
                    <div class="p-2 bg-emerald-950/40 rounded-lg border border-emerald-500/40 text-emerald-300 font-bold">
                      1. الأنظمة (Systems): دعم القرار السريري المحوسب التفاعلي
                    </div>
                    <div class="p-2 bg-slate-800/60 rounded-lg border border-cyan-500/30 text-cyan-300 font-semibold">
                      2. الإرشادات الملخصة (Summaries / Guidelines): إرشادات الممارسة المبنية على الأدلة
                    </div>
                    <div class="p-2 bg-slate-800/40 rounded-lg border border-slate-700 text-slate-300">
                      3. خلاصات المراجعات (Synopses of SRs): تقييم وجيز ومسبق للمراجعات
                    </div>
                    <div class="p-2 bg-slate-800/40 rounded-lg border border-slate-700 text-slate-300">
                      4. المراجعات المنهجية (Syntheses / Standard SRs): مراجعات كوكرين القياسية
                    </div>
                    <div class="p-2 bg-slate-800/40 rounded-lg border border-slate-700 text-slate-400">
                      5. خلاصات الدراسات الأولية (Synopses of Single Studies): مثل ملخصات ACP
                    </div>
                    <div class="p-2 bg-slate-800/40 rounded-lg border border-slate-700 text-slate-400">
                      6. الدراسات الفردية (Single Studies): تجارب RCTs ودراسات أولية منفردة [القاعدة]
                    </div>
                  </div>
                </div>
              </div>

              <!-- Circle of Methods & Comparison Table -->
              <div class="rich-card p-5 border-r-4 border-r-amber-500 overflow-x-auto">
                <h4 class="font-cairo font-bold text-base mb-3 text-amber-500 flex items-center gap-2">
                  <i class="fa-solid fa-circle-nodes"></i>
                  مقارنة هيكلية بين الأهرام الطبية ونموذج حلقة المناهج (Circle of Methods)
                </h4>
                <table class="w-full text-right text-xs">
                  <thead class="bg-slate-800/60 text-amber-400 font-cairo">
                    <tr>
                      <th class="p-3 rounded-r-lg">وجه المقارنة</th>
                      <th class="p-3">الهرم التقليدي الكلاسيكي</th>
                      <th class="p-3">هرم الـ 6S المعاصر [5]</th>
                      <th class="p-3 rounded-l-lg">نموذج حلقة المنهجيات البديل [6, 8]</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800 text-slate-300">
                    <tr class="hover:bg-slate-800/20 transition-all">
                      <td class="p-3 font-bold text-violet-400">التركيز الأساسي</td>
                      <td class="p-3">قوة تصميم الدراسة المنهجي وخطر الانحياز البيولوجي.</td>
                      <td class="p-3">الوصول السريع والتقييم المسبق ودعم القرار عند سرير المريض.</td>
                      <td class="p-3 font-semibold text-emerald-400">التعددية المنهجية وملاءمة المنهج لطبيعة السؤال السريري.</td>
                    </tr>
                    <tr class="hover:bg-slate-800/20 transition-all">
                      <td class="p-3 font-bold text-violet-400">قمة الهرم</td>
                      <td class="p-3">المراجعات المنهجية والتحليلات التلوية.</td>
                      <td class="p-3">أنظمة دعم القرار السريري المحوسبة (Systems).</td>
                      <td class="p-3 font-semibold text-emerald-400">لا توجد قمة؛ جميع المناهج على محيط دائرة متساوية القيمة.</td>
                    </tr>
                    <tr class="hover:bg-slate-800/20 transition-all">
                      <td class="p-3 font-bold text-violet-400">موقفها من الـ RCTs</td>
                      <td class="p-3">مرتبة عليا مقدسة فوق كافة الدراسات الفردية.</td>
                      <td class="p-3">دراسات أولية تحتاج لتوليف وتقييم مسبق في أسفل الهرم.</td>
                      <td class="p-3 font-semibold text-emerald-400">تتحدى تفوقها وتعتبرها غير صالحة لبعض الأسئلة المعقدة [7].</td>
                    </tr>
                    <tr class="hover:bg-slate-800/20 transition-all">
                      <td class="p-3 font-bold text-violet-400">التحديات والعيوب</td>
                      <td class="p-3">يهمل تفضيلات المرضى والظروف البيولوجية الخاصة.</td>
                      <td class="p-3">يتطلب بنية تحتية رقمية باهظة غير متوفرة في كل المشافي.</td>
                      <td class="p-3">صعوبة الموازنة لغياب معيار موحد للمفاضلة بين الأدلة.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          `
        },
        {
          id: "topic-6",
          title: "4.0 المصادر المركبة والتوليفية: المراجعات ومكتبة كوكرين",
          level: 1,
          subtitle: "Synthesised Sources: Systematic Reviews & The Cochrane Collaboration",
          content: `
            <div class="space-y-6">
              <div class="rich-card p-6 border-r-4 border-r-violet-500">
                <h3 class="font-cairo font-bold text-lg mb-3 flex items-center gap-2 text-violet-500 dark:text-violet-400">
                  <i class="fa-solid fa-box-archive text-violet-500"></i>
                  المصادر المركبة والتوليفية (Synthesised Resources)
                </h3>
                <p class="text-slate-300 leading-relaxed text-sm">
                  تُشكل مصادر المعلومات التي يتم تركيبها وتوليفها من الدراسات الأولية مستوى عالياً جداً من الأدلة العلمية. تهدف بشكل أساسي إلى ترجمة نتائج البحوث المعقدة وتطبيقها في الممارسة اليومية وتوجيه القرار المشترك بين الطبيب والمريض [11].
                </p>
              </div>

              <!-- Cochrane & Systematic Reviews Breakdown -->
              <div class="rich-card p-6 border-r-4 border-r-emerald-500">
                <div class="flex items-center gap-2 text-emerald-500 font-cairo font-bold text-base mb-3">
                  <i class="fa-solid fa-medal"></i>
                  <span>المراجعات المنهجية ومكتبة كوكرين (The Cochrane Collaboration)</span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed mb-4">
                  نشأ المفهوم في ثمانينيات القرن الماضي بإلهام من الطبيب والباحث <strong>آرشي كوكرين (Archie Cochrane)</strong> الذي انتقد تشتت التجارب السريرية الفردية. تطورت هذه الجهود لتأسيس "مكتبة كوكرين" في منتصف التسعينيات، والتي أصبحت تمثل <strong>المعيار الذهبي (Gold Standard)</strong> للمراجعات الكمية عالية الجودة [11].
                </p>

                <!-- Cochrane Reading Tips -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                  <div class="p-3 bg-slate-800/40 rounded-xl border border-slate-700">
                    <h5 class="font-bold text-cyan-400 text-xs flex items-center gap-1 mb-1">
                      <i class="fa-solid fa-file-lines"></i>
                      الملخص اللغوي المبسط (Plain Language Summary)
                    </h5>
                    <p class="text-[11px] text-slate-400">يوجد مباشرة بعد الملخص الأكاديمي، ويختصر جوهر المراجعة بكلمات مبسطة خالية من المصطلحات المعقدة [12].</p>
                  </div>
                  <div class="p-3 bg-slate-800/40 rounded-xl border border-slate-700">
                    <h5 class="font-bold text-emerald-400 text-xs flex items-center gap-1 mb-1">
                      <i class="fa-solid fa-chart-gantt"></i>
                      مخطط الغابة (Forest Plot)
                    </h5>
                    <p class="text-[11px] text-slate-400">رسم بياني يوضح نتائج كل دراسة أولية بجانب النتيجة الكلية المجمعة، مما يمنح ملخصاً بصرياً فورياً ودقيقاً [13].</p>
                  </div>
                </div>
              </div>

              <!-- Pros & Cons Table -->
              <div class="rich-card p-5 border-r-4 border-r-cyan-500 overflow-x-auto">
                <h4 class="font-cairo font-bold text-base mb-3 text-cyan-500 flex items-center gap-2">
                  <i class="fa-solid fa-scale-balanced"></i>
                  موازنة منهجية: مزايا وعيوب المراجعات المنهجية (Pros & Cons)
                </h4>
                <table class="w-full text-right text-xs">
                  <thead class="bg-slate-800/60 text-cyan-400 font-cairo">
                    <tr>
                      <th class="p-3 rounded-r-lg">وجه المقارنة</th>

              </div>

          id: "topic-9",
          title: "5.0 المصادر المقيمة مسبقاً والمصادر المتخصصة",
          level: 1,
          subtitle: "Pre-appraised Synopses & Specialised Information Platforms",
          content: `
            <div class="space-y-6">
              <div class="rich-card p-6 border-r-4 border-r-violet-500">
                <h3 class="font-cairo font-bold text-lg mb-3 flex items-center gap-2 text-violet-500 dark:text-violet-400">
                  <i class="fa-solid fa-filter text-violet-500"></i>
                  المصادر المقيمة مسبقاً (Pre-appraised Sources)
                </h3>
                <p class="text-slate-300 leading-relaxed text-sm">
                  إذا كان الموضوع السريري أكثر تحديداً وضيقاً (More circumscribed) مما تغطيه المنصات التوليفية الكبرى، أو إذا كنت تتصفح لمواكبة المستجدات، فإن المصادر المقيمة مسبقاً هي الخيار الأمثل؛ حيث تظهر كـ <strong>ملخصات سريرية مهضومة (Clinical Digests)</strong> منتقاة بعناية من المجلات المحورية مع تقييم نقدي وجيز [21].
                </p>
              </div>

              <!-- Digests & Cochrane Integration -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="rich-card p-5 border-r-4 border-r-cyan-500">
                  <h4 class="font-cairo font-bold text-base mb-3 text-cyan-500 flex items-center gap-2">
                    <i class="fa-solid fa-newspaper"></i>
                    أبرز مجلات الهضم والتقييم السريع
                  </h4>
                  <ul class="text-xs text-slate-300 space-y-2 leading-relaxed">
                    <li><strong class="text-cyan-400">• BMJ Evidence-Based Medicine & BMJ Mental Health:</strong> مراجعات نقدية للأبحاث المؤثرة على القرارات السريرية [21].</li>
                    <li><strong class="text-cyan-400">• نادي مجلات الكلية الأمريكية للأطباء (ACP Journal Club):</strong> أحد أعرق مصادر التقييم النقدي السريع للأبحاث الباطنية [21].</li>
                    <li><strong class="text-emerald-400">• خلاصات POEMS:</strong> "أدلة موجهة للمريض وتهم الممارسة" تركز حصرياً على النتائج السريرية الحقيقية (وفيات، جودة حياة) وليس النتائج المخبرية البديلة [21].</li>
                    <li><strong class="text-amber-400">• تحديثات PCORI Evidence Updates:</strong> تحديثات موجزة وعميقة لخدمة الأطباء والمرضى في اتخاذ القرار [21, 22].</li>
                  </ul>
                </div>

                <div class="rich-card p-5 border-r-4 border-r-emerald-500">
                  <h4 class="font-cairo font-bold text-base mb-3 text-emerald-500 flex items-center gap-2">
                    <i class="fa-solid fa-server"></i>
                    البحث الموحد في مكتبة كوكرين
                  </h4>
                  <ul class="text-xs text-slate-300 space-y-2 leading-relaxed">
                    <li><strong class="text-emerald-400">• CDSR:</strong> قاعدة بيانات مراجعات كوكرين المنهجية (المعيار الذهبي) [23].</li>
                    <li><strong class="text-emerald-400">• Cochrane Clinical Answers:</strong> إجابات سريرية مقتضبة ومباشرة عند bedside المريض.</li>
                    <li><strong class="text-cyan-400">• CENTRAL:</strong> السجل المركزي للتجارب العشوائية ذات الشواهد؛ يضم دليلاً جامعاً للتجارب المستخدمة بكوكرين [23].</li>
                    <li><strong class="text-amber-400">• NHS EED:</strong> قاعدة التقييم الاقتصادي الصحي التابعة لـ NHS وتضم ملخصات مقيمة لدراسات التكلفة والجدوى [23].</li>
                  </ul>
                </div>
              </div>

              <!-- Specialised Resources Table -->
              <div class="rich-card p-5 border-r-4 border-r-violet-500 overflow-x-auto">
                <h4 class="font-cairo font-bold text-base mb-3 text-violet-400 flex items-center gap-2">
                  <i class="fa-solid fa-stethoscope"></i>
                  المصادر المتخصصة وعوائدها السريرية (Specialised Resources)
                </h4>
                <table class="w-full text-right text-xs">
                  <thead class="bg-slate-800/60 text-violet-400 font-cairo">
                    <tr>
                      <th class="p-3 rounded-r-lg">المنصة المتخصصة</th>
                      <th class="p-3">طبيعة ونوع المحتوى</th>
                      <th class="p-3 rounded-l-lg">الفوائد والعوائد السريرية والتشخيصية</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800 text-slate-300">
                    <tr class="hover:bg-slate-800/20 transition-all">
                      <td class="p-3 font-bold text-cyan-400">شبكة الأوبئة والأمراض المعدية العالمية (GIDEON)</td>
                      <td class="p-3">قاعدة بيانات تفاعلية مدعومة بالأدلة للأمراض المعدية وعلم الأوبئة [24].</td>
                      <td class="p-3">• التشخيص التفريقي للأمراض المعدية والعلاجات.<br>• تتبع انتشار الأوبئة جغرافياً ومقاومة المضادات الحيوية [24].</td>
                    </tr>
                    <tr class="hover:bg-slate-800/20 transition-all">
                      <td class="p-3 font-bold text-cyan-400">المكتبة النفسية المتخصصة (Psychiatry Online)</td>

            msg = `🌟 <strong>كفاءة سريرية فائقة (One-Stop):</strong> يبحث TRIP في مئات المصادر دفعة واحدة ويفرزها منهجياً؛ مثالي تماماً لوقتك المتاح (${time} دقيقة).`;
            res.className = "mt-3 p-3 bg-cyan-950/40 rounded-lg text-xs leading-relaxed text-cyan-400 block border border-cyan-800";
          } else if (strat === 'poc') {
            msg = `⚡ <strong>الخيار الذهبي عند سرير المريض:</strong> إجابة فورية ومقيمة مسبقاً خلال أقل من دقيقتين مع خلاصة مباشرة لتطبيقها في رعاية المريض.`;
            res.className = "mt-3 p-3 bg-emerald-950/40 rounded-lg text-xs leading-relaxed text-emerald-300 block border border-emerald-700";
          }
          res.innerHTML = msg;
        };
      }
    }

    function setupEventListeners() {
      document.getElementById('drawer-toggle-btn').onclick = openDrawer;
      document.getElementById('close-drawer-btn').onclick = closeDrawer;
      document.getElementById('drawer-overlay').onclick = closeDrawer;
      document.getElementById('theme-toggle-btn').onclick = toggleTheme;

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
      });
    }
  </script>
</body>
</html>
