          title: "2.1 السؤال الثالث وخوارزمية شجرة القرار (Decision Tree Model)",
          level: 2,
          subtitle: "Methodological Congruence & Bifurcation Tree Model",
          content: `
            <div class="space-y-6">
              <div class="rich-card p-6 border-r-4 border-r-amber-500">
                <h3 class="font-cairo font-bold text-lg mb-2 text-amber-400 flex items-center gap-2">
                  <i class="fa-solid fa-code-branch"></i>
                  السؤال الثالث: هل كان تصميم الدراسة ملائماً للسؤال والمجال البحثي؟
                </h3>
                <p class="text-slate-300 text-xs leading-relaxed mb-3">
                  <strong>مبدأ الملاءمة الحتمية (Methodological Congruence):</strong> لا توجد دراسة صحيحة ما لم يكن تصميمها المنهجي متوافقاً بطبيعته مع السؤال المطروح.
                </p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div class="p-3 bg-rose-950/20 border border-rose-500/30 rounded-xl">
                    <span class="text-rose-400 font-bold text-xs block mb-1">خطأ قاتل 1:</span>
                    <p class="text-[11px] text-slate-300">محاولة إثبات فاعلية دواء جديد عبر استبيان مقطعي بدلاً من إجراء تجربة معشاة (RCT).</p>
                  </div>
                  <div class="p-3 bg-rose-950/20 border border-rose-500/30 rounded-xl">
                    <span class="text-rose-400 font-bold text-xs block mb-1">خطأ قاتل 2:</span>
                    <p class="text-[11px] text-slate-300">محاولة فهم تجربة المريض مع الألم النفسي عبر أرقام وتجارب معشاة بدلاً من الأبحاث النوعية.</p>
                  </div>
                </div>
              </div>

              <!-- Interactive Decision Tree Flowchart Card -->
              <div class="rich-card p-6 border-r-4 border-r-cyan-500">
                <div class="flex items-center gap-2 text-cyan-400 mb-4">
                  <i class="fa-solid fa-sitemap text-xl"></i>
                  <h4 class="font-cairo font-bold text-base">نموذج شجرة القرار والتفرع الثنائي (Decision Tree & Bifurcation Model)</h4>
                </div>
                
                <div class="space-y-3 text-xs font-arabic">
                  <!-- Root Node -->
                  <div class="p-3 bg-slate-900/80 border border-violet-500/40 rounded-xl text-center font-bold text-violet-300">
                    <i class="fa-solid fa-file-medical ml-1"></i> فحص الورقة الطبية: ما هو نوع الورقة العام؟
                  </div>

                  <!-- Level 1 Branching -->
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pr-4 border-r-2 border-slate-700">
                    <div class="p-3 bg-violet-950/30 border border-violet-500/30 rounded-xl">
                      <span class="text-violet-400 font-bold block mb-1">1. دراسات ثانوية (توليفية):</span>
                      <p class="text-[11px] text-slate-300">مراجعة منهجية / تحليل تلوي / دلائل إرشادية سريرية.</p>
                    </div>

                    <div class="p-3 bg-cyan-950/30 border border-cyan-500/30 rounded-xl">
                      <span class="text-cyan-400 font-bold block mb-1">2. دراسات أولية (بيانات خام):</span>
                      <p class="text-[11px] text-slate-300">انتقل للسؤال: هل قام الباحث بتعيين التدخل بنفسه؟</p>
                    </div>
                  </div>

                  <!-- Level 2 Branching: Experimental vs Observational -->
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pr-8 border-r-2 border-cyan-700/60">
                    <div class="p-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl">
                      <span class="text-emerald-400 font-bold block mb-1"><i class="fa-solid fa-check ml-1"></i>نعم (تجريبية Experimental):</span>
                      <div class="space-y-1 mt-2 text-[11px]">
                        <p class="text-slate-300">هل تم التوزيع عشوائياً؟</p>
                        <p class="text-emerald-300 font-semibold">• نعم ➔ تجربة معشاة ذات شواهد (RCT) [مجال العلاج]</p>
                        <p class="text-slate-400">• لا ➔ تجربة شبه تجريبية (Non-RCT)</p>
                      </div>
                    </div>

                    <div class="p-3 bg-amber-950/30 border border-amber-500/30 rounded-xl">
                      <span class="text-amber-400 font-bold block mb-1"><i class="fa-solid fa-xmark ml-1"></i>لا (رصدية Observational):</span>
                      <div class="space-y-1 mt-2 text-[11px]">
                        <p class="text-slate-300">هل توجد مجموعة مقارنة / شواهد؟</p>
                        <p class="text-slate-400">• لا ➔ تقرير حالة أو سلسلة حالات (Case Report / Series)</p>
                        <p class="text-amber-300 font-semibold">• نعم ➔ حدد الاتجاه الزمني للملاحظة:</p>
                        <div class="pr-3 text-[10px] space-y-0.5 border-r border-amber-500/40 mt-1">
                          <p class="text-cyan-300">▪ تتبع مستقبلي للأمام ➔ دراسة أتراب (Cohort) [الإنذار / السببية]</p>
                          <p class="text-rose-300">▪ بحث استرجاعي للخلف ➔ حالات وشواهد (Case-Control) [الأمراض النادرة]</p>
                          <p class="text-violet-300">▪ في لحظة زمنية واحدة ➔ مسح مقطعي (Cross-Sectional) [التشخيص / المسح]</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `
        },
        {
          id: "topic-6",
          title: "3.0 التجارب المعشاة ذات الشواهد (RCTs) وركائز الصرامة المنهجية",
          level: 1,
          subtitle: "Randomised Controlled Trials: Rigour Pillars, ITT & Limitations",
          content: `
            <div class="space-y-6">
              <div class="rich-card p-6 border-r-4 border-r-emerald-500">
                <div class="flex items-center gap-2 text-emerald-400 mb-2">
                  <i class="fa-solid fa-flask-vial text-xl"></i>
                  <h3 class="font-cairo font-bold text-lg">التجارب المعشاة ذات الشواهد (Randomised Controlled Trials - RCTs)</h3>
                </div>
                <p class="text-slate-300 text-xs leading-relaxed mb-3">
                  <strong>المفهوم الجوهري (Definition & Mechanism):</strong> دراسة تجريبية (<span class="font-mono text-emerald-300">Experimental Study</span>) يُوزع فيها المشاركون عشوائياً وبمحض الصدفة الرياضية إلى مجموعتين متكافئتين أو أكثر:
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="text-emerald-400 font-bold block mb-1">مجموعة التدخل (Intervention Group):</span>
                    <p class="text-slate-400">تتلقى العلاج أو الإجراء الجراحي أو الدواء الجديد قيد الاختبار.</p>
                  </div>
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="text-cyan-400 font-bold block mb-1">مجموعة الشواهد (Control Group):</span>
                    <p class="text-slate-400">تتلقى علاجاً وهمياً غير فعال (<span class="font-mono text-cyan-300">Placebo</span>) أو العلاج القياسي المعتاد (<span class="font-mono text-cyan-300">Standard of Care</span>).</p>
                  </div>
                </div>
              </div>

              <!-- Why RCTs Matter Table -->
              <div class="rich-card p-6 border-r-4 border-r-cyan-500">
                <h4 class="font-cairo font-bold text-base mb-3 text-cyan-400 flex items-center gap-2">
                  <i class="fa-solid fa-award"></i>
                  لماذا تُعد التجارب المعشاة المعيار الذهبي لتقييم العلاجات؟ (Why do RCTs matter?)
                </h4>
                <div class="overflow-x-auto">
                  <table class="w-full text-xs text-right border-collapse">
                    <thead>
                      <tr class="border-b border-slate-700 bg-slate-800/40 text-cyan-300 font-cairo">
                        <th class="p-3">الميزة المنهجية الجوهرية (Methodological Advantage)</th>
                        <th class="p-3">التفسير العلمي والسريري (Scientific Rationale)</th>
                        <th class="p-3">الأثر الإحصائي على دقة النتائج (Statistical Impact)</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800 text-slate-300">
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-emerald-400">القضاء على تحيز الاختيار والتعيين (Elimination of Selection Bias)</td>
                        <td class="p-3">منع الباحث أو الطبيب من توجيه المرضى الأقل مرجعية أو الأفضل صحة نحو علاج معين عمداً أو دون وعي.</td>
                        <td class="p-3 text-cyan-300 font-mono">تكافؤ تام في نقطة البداية بين المجموعات (Baseline Equivalence).</td>
                      </tr>
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-emerald-400">تحييد وتوزيع عوامل الخلط المجهولة (Balancing Unknown Confounders)</td>
                        <td class="p-3">التوزيع العشوائي الصارم يوزع كافة المتغيرات المؤثرة (المعروفة كالعمر والوزن، والمجهولة كالطفرات الجينية) بالتساوي.</td>
                        <td class="p-3 text-cyan-300">عزل المتغير المستقل (العلاج) كسبب وحيد ومباشر لأي فرق في النتائج.</td>
                      </tr>
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-emerald-400">إمكانية تطبيق التعمية المزدوجة (Double-Blind Capability)</td>
                        <td class="p-3">منع انحياز توقعات المريض (<span class="font-mono text-xs">Placebo effect</span>) وانحياز الطبيب في تقييم التحسن السريري.</td>
                        <td class="p-3 text-cyan-300">قياس الأثر البيولوجي والسريري الحقيقي للتدخل الطبي بنقاء تام.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Rigour Pillars in RCTs -->
              <div class="rich-card p-6 border-r-4 border-r-violet-500">
                <h4 class="font-cairo font-bold text-base mb-3 text-violet-400 flex items-center gap-2">
                  <i class="fa-solid fa-shield-virus"></i>
                  ركائز الصرامة المنهجية في التجارب المعشاة (Rigour Pillars in RCTs)
                </h4>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="font-bold text-violet-300 block mb-1">1. إخفاء التوزيع (Allocation Concealment):</span>
                    <p class="text-slate-400">حجب مسار التعشية عن الأطباء والباحثين القائمين على إدخال المرضى لمنع التأثير في قرار ضم المريض.</p>
                  </div>
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="font-bold text-cyan-300 block mb-1">2. مستويات التعمية (Blinding / Masking):</span>
                    <ul class="text-[11px] text-slate-400 space-y-1">
                      <li>• <strong>أحادية (Single Blind):</strong> المريض لا يعلم العالج.</li>
                      <li>• <strong>مزدوجة (Double Blind):</strong> المريض والطبيب كلاهما يجهلان هوية العلاج.</li>
                      <li>• <strong>ثلاثية (Triple Blind):</strong> تمتد لتشمل المحلل الإحصائي ومقيمي النتائج.</li>
                    </ul>
                  </div>
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="font-bold text-emerald-300 block mb-1">3. التحليل بنية العلاج (ITT Analysis):</span>
                    <p class="text-slate-400">تحليل جميع المرضى ضمن المجموعات التي خُصصوا لها أصلاً عند بدء التعشية، بغض النظر عما إذا التزموا بالعلاج أو انسحبوا، لمنع تحيز التسرب (<span class="font-mono text-[10px]">Attrition Bias</span>).</p>
                  </div>
                </div>
              </div>

              <!-- Limitations of RCTs Table -->
              <div class="rich-card p-6 border-r-4 border-r-rose-500">
                <h4 class="font-cairo font-bold text-base mb-3 text-rose-400 flex items-center gap-2">
                  <i class="fa-solid fa-triangle-exclamation"></i>
                  القيود والعيوب المنهجية للتجارب المعشاة (Limitations of RCTs)
                </h4>
                <div class="overflow-x-auto">
                  <table class="w-full text-xs text-right border-collapse">
                    <thead>
                      <tr class="border-b border-slate-700 bg-slate-800/40 text-rose-300 font-cairo">
                        <th class="p-3">القيد المنهجي (Limitation)</th>
                        <th class="p-3">الوصف السريري والتحدي الميداني (Clinical Description & Challenge)</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800 text-slate-300">
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-white">الموانع الأخلاقية (Ethical Constraints)</td>
                        <td class="p-3">لا يمكن تعريض المرضى عشوائياً لعوامل ضارة مفترضة (مثل إجبار مجموعة على التدخين أو التعرض للإشعاع).</td>
                      </tr>
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-white">الكلفة المالية والزمن (High Cost & Long Duration)</td>
                        <td class="p-3">تتطلب ميزانيات ضخمة وفرق عمل متخصصة ومتابعة مستمرة قد تمتد لسنوات طويلة.</td>
                      </tr>
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-white">الصلاحية الخارجية ومحدودية التعميم (Limited External Validity)</td>
                        <td class="p-3">معايير الاستبعاد الصارمة تجعل عينة التجربة مثالية ونقية، مما يقلل انطباقها على مرضى الواقع المعقدين المصابين بأمراض متعددة.</td>
                      </tr>
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-white">العجز عن رصد الآثار الجانبية النادرة جداً (Rare Adverse Events)</td>
                        <td class="p-3">حجم عينات التجارب المعشاة لا يكفي إحصائياً لاكتشاف المضاعفات النادرة جداً التي تحدث لواحد من كل مئة ألف مريض.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `
        },
        {
          id: "topic-7",
          title: "3.1 دراسات الأتراب / الحشدية الطولية (Cohort Studies)",
          level: 2,
          subtitle: "Cohort Studies: Etymology, Directionality, Formulas & Metrics",
          content: `
            <div class="space-y-6">
              <div class="rich-card p-6 border-r-4 border-r-cyan-500">
                <div class="flex items-center gap-2 text-cyan-400 mb-2">
                  <i class="fa-solid fa-users-line text-xl"></i>
                  <h3 class="font-cairo font-bold text-lg">دراسات الأتراب / الحشدية (Cohort Studies)</h3>
                </div>
                <p class="text-slate-300 text-xs leading-relaxed mb-3">
                  <strong class="text-violet-300">الأصل اللغوي والتعريف (Etymology & Definition):</strong> كلمة <span class="font-mono text-cyan-300">Cohort</span> مشتقة تاريخياً من الكتائب العسكرية في الجيش الروماني القديم التي تسير معاً وتخوض نفس الظروف والتجارب.
                </p>
                <p class="text-slate-300 text-xs leading-relaxed">
                  <strong class="text-emerald-300">التعريف المنهجي:</strong> دراسة رصدية تتبعية طولية (<span class="font-mono text-xs text-emerald-400">Prospective Longitudinal Observational Study</span>)؛ تبدأ بمجموعة محددة من الأفراد الأصحاء (غير المصابين بالمرض قيد الدراسة في البداية)، وتتبعهم عبر مسار الزمن بعد فرزهم في نقطة البداية إلى:
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3 text-xs">
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="text-amber-400 font-bold block mb-1">مجموعة معرضة (Exposed Group):</span>
                    <p class="text-slate-400">أفراد يتعرضون لعامل خطر بيئي أو سلوكي معين (مثل: المدخنون، أو عمال المناجم).</p>
                  </div>
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="text-emerald-400 font-bold block mb-1">مجموعة غير معرضة (Unexposed Group):</span>
                    <p class="text-slate-400">أفراد يشبهون المجموعة الأولى في كافة الخصائص ولكنهم غير معرضين لعامل الخطر.</p>
                  </div>
                </div>
              </div>

              <!-- Temporal Patterns Table -->
              <div class="rich-card p-6 border-r-4 border-r-violet-500">
                <h4 class="font-cairo font-bold text-base mb-3 text-violet-400 flex items-center gap-2">
                  <i class="fa-solid fa-clock-rotate-left"></i>
                  الأنماط الزمنية لدراسات الأتراب (Temporal Direction & Execution)
                </h4>
                <div class="overflow-x-auto">
                  <table class="w-full text-xs text-right border-collapse">
                    <thead>
                      <tr class="border-b border-slate-700 bg-slate-800/40 text-violet-300 font-cairo">
                        <th class="p-3">نمط دراسة الأتراب (Cohort Type)</th>
                        <th class="p-3">الاتجاه الزمني والتنفيذ (Temporal Direction & Execution)</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800 text-slate-300">
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-white">دراسة أتراب مستقبلية (Prospective Cohort)</td>
                        <td class="p-3">يتم تحديد التعرض في الوقت الحاضر، ثم تتبع العينة نحو المستقبل لرصد حدوث المرض.</td>
                      </tr>
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-white">دراسة أتراب استرجاعية / تاريخية (Retrospective / Historical Cohort)</td>
                        <td class="p-3">يتم استخدام سجلات تاريخية موثقة من الماضي لتحديد من كان معرضاً، وتتبع سجلاتهم وصولاً للحاضر لرصد النتيجة.</td>
                      </tr>
                      <tr class="hover:bg-slate-800/20">
                        <td class="p-3 font-bold text-white">دراسة أتراب البداية (Inception Cohort Study)</td>
                        <td class="p-3 text-amber-300">تتبع المرضى منذ اللحظة الأولى لتشخيصهم بالمرض لدراسة المآل والتكهن الطبي (<span class="font-mono text-[10px]">Prognosis</span>).</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Mathematical Formulas in KaTeX Card -->
              <div class="rich-card p-6 border-r-4 border-r-emerald-500">
                <h4 class="font-cairo font-bold text-base mb-3 text-emerald-400 flex items-center gap-2">
                  <i class="fa-solid fa-calculator"></i>
                  المقاييس الوبائية المستخرجة مباشرة من دراسات الأتراب (KaTeX)
                </h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                  <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="font-bold text-cyan-300 block mb-1">الخطر النسبي (Relative Risk - RR):</span>
                    <p class="text-slate-400 text-[11px] mb-2">نسبة خطر حدوث المرض لدى المعرضين مقارنة بغير المعرضين:</p>
                    <div class="text-center py-2 bg-slate-950/60 rounded-lg text-cyan-400 dir-ltr font-mono text-sm">
                      $$ RR = \frac{I_{\text{exposed}}}{I_{\text{unexposed}}} = \frac{a / (a + b)}{c / (c + d)} $$
                    </div>
                  </div>

                  <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="font-bold text-amber-300 block mb-1">الخطر المنسوب (Attributable Risk - AR):</span>
                    <p class="text-slate-400 text-[11px] mb-2">مقدار الخطر الإضافي الذي يمكن عزوه حصرياً لعامل التعرض:</p>
                    <div class="text-center py-2 bg-slate-950/60 rounded-lg text-amber-400 dir-ltr font-mono text-sm">
                      $$ AR = I_{\text{exposed}} - I_{\text{unexposed}} $$
                    </div>
                  </div>
                </div>
              </div>

              <!-- Strengths and Limitations -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="rich-card p-5 border-r-4 border-r-emerald-500">
                  <h5 class="font-cairo font-bold text-sm text-emerald-400 mb-2"><i class="fa-solid fa-check ml-1"></i>المزايا الكبرى (Key Strengths)</h5>
                  <ul class="text-xs text-slate-300 space-y-1.5 list-disc list-inside">
                    <li><strong>إثبات التسلسل الزمني القاطع:</strong> التعرض يسبق حدوث المرض بيقين تام.</li>

            <div class="space-y-6">

                </div>
                <p class="text-slate-300 text-xs leading-relaxed mb-3">
                  <strong>التعريف والمنطق المنهجي العكسي (Definition & Reverse Logic):</strong> دراسة رصدية استرجاعية مقارنة (<span class="font-mono text-amber-300">Retrospective Observational Study</span>)؛ تنطلق من النتيجة المرضية بعد وقوعها بالفعل للبحث عن أسبابها المحتملة في الماضي عبر مجموعتين:

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs mb-4">
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="text-rose-400 font-bold block mb-1">الحالات (Cases):</span>
                    <p class="text-slate-400">مجموعة من الأفراد المصابين بالمرض قيد الدراسة فعلياً.</p>
                  </div>
                  <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    <span class="text-cyan-400 font-bold block mb-1">الشواهد (Controls):</span>
                    <p class="text-slate-400">مجموعة من الأفراد المطابقين للحالات في العمر والجنس والبيئة ولكنهم أصحاء وغير مصابين بالمرض.</p>

                  </div>

              <!-- Statistical Metric: Odds Ratio (KaTeX) -->
              <div class="rich-card p-6 border-r-4 border-r-cyan-500">
                <h4 class="font-cairo font-bold text-base mb-2 text-cyan-400 flex items-center gap-2">

                  المقياس الإحصائي الوحيد الصالح هنا، ويقيس أرجحية التعرض لعامل الخطر بين الحالات مقسومة على أرجحية التعرض بين الشواهد (لأنه لا يمكن حساب معدل الحدوث <span class="font-mono text-cyan-300">Incidence</span> أو الخطر النسبي المباشر <span class="font-mono text-cyan-300">RR</span> لأن العدد الكلي للمجتمع غير معروف):

                  </ul>

                  <p class="p-2 bg-slate-900/40 rounded border border-slate-800"><strong class="text-violet-400">3.</strong> Altman DG. The scandal of poor medical research. <em>British Medical Journal (BMJ)</em>, 1994; 308: 283–284.</p>
                  <p class="p-2 bg-slate-900/40 rounded border border-slate-800"><strong class="text-violet-400">4.</strong> Ioannidis JPA. Why most published research findings are false. <em>PLoS Medicine</em>, 2005; 2(8): e124.</p>
                  <p class="p-2 bg-slate-900/40 rounded border border-slate-800"><strong class="text-violet-400">5.</strong> Guyatt GH, Sackett DL, Cook DJ, et al. Users' Guides to the Medical Literature: A manual for evidence-based clinical practice. <em>JAMA & The Evidence-Based Medicine Working Group</em>, 1993–2000.</p>
                  <p class="p-2 bg-slate-900/40 rounded border border-slate-800"><strong class="text-violet-400">6.</strong> Greenhalgh T, Howick J, Maskrey N. Evidence based medicine: a movement in crisis? <em>British Medical Journal (BMJ)</em>, 2014; 348: g3725.</p>
                  <p class="p-2 bg-slate-900/40 rounded border border-slate-800"><strong class="text-violet-400">7.</strong> Greenhalgh T. <em>How to Read a Paper: The Basics of Evidence-Based Medicine</em> (7th Edition). Wiley-Blackwell, 2024.</p>
                </div>
              </div>
            </div>
          `
        }
      ]
    };

    /* ==========================================================================
       UI CONTROLLER ENGINE
       ========================================================================== */
    let activeTopicId = LECTURE_DATA.topics[0]?.id || '';
    let currentChartInstance = null;
    let lastScrollY = window.scrollY;

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderLectureMetadata();
      renderDrawerTree();
      renderTopic(activeTopicId);
      setupEventListeners();
      setupHeaderAutoHiding();
    });

    // Theme Switcher Logic
    function initTheme() {
      const savedTheme = localStorage.getItem('app-theme') || 'dark';
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');

      if (savedTheme === 'dark') {
        htmlEl.classList.add('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-amber-400';
      } else {
        htmlEl.classList.remove('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-slate-700';
      }
    }

    function toggleTheme() {
      triggerHaptic();
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');
      
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        localStorage.setItem('app-theme', 'light');
        if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-slate-700';
      } else {
        htmlEl.classList.add('dark');
        localStorage.setItem('app-theme', 'dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-amber-400';
      }
    }

    // Auto-Hiding Header on Scroll
    function setupHeaderAutoHiding() {
      const header = document.getElementById('main-header');
      window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        if (currentScrollY > lastScrollY && currentScrollY > 70) {
          header.classList.add('-translate-y-full');
        } else {
          header.classList.remove('-translate-y-full');
        }
        lastScrollY = currentScrollY;
      });
    }

    // Safe Telegram Haptics
    function triggerHaptic() {
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
      } catch (e) {}
    }

    // Inject Metadata
    function renderLectureMetadata() {
      document.getElementById('lecture-title-display').innerText = LECTURE_DATA.title;
      document.getElementById('lecture-subtitle-display').innerText = LECTURE_DATA.subtitle;
      document.getElementById('chapter-tag-display').innerText = LECTURE_DATA.chapterTag;
      document.getElementById('topic-count-display').innerText = `${LECTURE_DATA.topics.length} وحدات دراسية`;
    }

    // Drawer Tree Renderer
    function renderDrawerTree() {
      const container = document.getElementById('drawer-tree-container');
      container.innerHTML = '';

      LECTURE_DATA.topics.forEach((topic) => {
        const isLevel2 = topic.level === 2;
        const isLevel3 = topic.level === 3;
        const indentClass = isLevel3 ? 'mr-5 border-r-2 border-slate-700/60 pr-2' : isLevel2 ? 'mr-2.5 border-r-2 border-violet-500/30 pr-2' : 'mr-0';
        
        const btn = document.createElement('button');
        btn.className = `w-full text-right p-2.5 rounded-xl transition-all flex items-center justify-between text-xs font-cairo font-bold ${indentClass} ${
          topic.id === activeTopicId 
            ? 'bg-violet-600/20 text-violet-400 border border-violet-500/40 shadow-sm' 
            : 'hover:bg-slate-800/30 text-slate-400'
        }`;
        
        btn.innerHTML = `
          <span class="truncate ml-2">${topic.title}</span>
          <i class="fa-solid fa-chevron-left text-[10px] opacity-60"></i>
        `;

        btn.onclick = () => {
          triggerHaptic();
          switchTopic(topic.id);
          closeDrawer();
        };

        container.appendChild(btn);
      });
    }

    // Render Active Topic
    function renderTopic(topicId) {
      const topic = LECTURE_DATA.topics.find(t => t.id === topicId);
      if (!topic) return;

      activeTopicId = topicId;
      const viewport = document.getElementById('active-topic-viewport');

      if (currentChartInstance) {
        currentChartInstance.destroy();
        currentChartInstance = null;
      }

      viewport.innerHTML = `
        <div class="rich-card p-6 border-b-2 border-b-violet-500/30">
          <span class="text-[11px] font-bold text-violet-500 dark:text-violet-400 uppercase tracking-wider block mb-1">${topic.subtitle || ''}</span>
          <h2 class="font-cairo font-extrabold text-xl md:text-2xl">${topic.title}</h2>
        </div>
        <div>
          ${topic.content}
        </div>
      `;

      // Render KaTeX Formulas safely
      if (window.renderMathInElement) {
        try {
          renderMathInElement(viewport, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false
          });
        } catch (e) {}
      }

      // Render Chart if config exists
      if (topic.chartConfig && document.getElementById('topicChart')) {
        const ctx = document.getElementById('topicChart').getContext('2d');
        currentChartInstance = new Chart(ctx, topic.chartConfig);
      }

      renderDrawerTree();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTopic(topicId) {
      renderTopic(topicId);
    }

    function openDrawer() {
      triggerHaptic();
      document.getElementById('right-outline-drawer').classList.remove('translate-x-full');
      document.getElementById('drawer-overlay').classList.remove('hidden');
    }

    function closeDrawer() {
      document.getElementById('right-outline-drawer').classList.add('translate-x-full');
      document.getElementById('drawer-overlay').classList.add('hidden');
    }

    function setupEventListeners() {
      document.getElementById('drawer-toggle-btn').onclick = openDrawer;
      document.getElementById('close-drawer-btn').onclick = closeDrawer;
      document.getElementById('drawer-overlay').onclick = closeDrawer;
      document.getElementById('theme-toggle-btn').onclick = toggleTheme;

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
      });
    }
  </script>
</body>
</html>
